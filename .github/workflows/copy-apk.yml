name: Copy rager.apk to stream-play-plus.apk
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  copy-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy APK byte by byte
        run: |
          cp assets/rager.apk assets/stream-play-plus.apk
          ls -l assets/rager.apk assets/stream-play-plus.apk
          cmp assets/rager.apk assets/stream-play-plus.apk
      - name: Commit copied APK
        run: |
          git config user.name "chechosirr"
          git config user.email "chechosirr@users.noreply.github.com"
          git add assets/stream-play-plus.apk
          git diff --cached --quiet || git commit -m "App Rager v1.2.9 (versionCode 12): entrada con la cuenta Rager"
          git push
