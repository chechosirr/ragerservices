name: Sync stream-play-plus APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy rager.apk over stream-play-plus.apk
        run: cp assets/rager.apk assets/stream-play-plus.apk
      - name: Commit the copy
        run: |
          git config user.name "chechosirr"
          git config user.email "chechosirr@users.noreply.github.com"
          git add assets/stream-play-plus.apk
          git diff --cached --quiet || git commit -m "App Rager v1.2.12 (versionCode 15): bucle de actualización corregido, RAGER se escribe al entrar y app sin sonidos"
          git push
