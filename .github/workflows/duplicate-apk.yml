name: Duplicar APK a stream-play-plus

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  duplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copiar el APK
        run: cp assets/rager.apk assets/stream-play-plus.apk
      - name: Publicar la copia
        run: |
          git config user.name "chechosirr"
          git config user.email "chechosirr@users.noreply.github.com"
          git add assets/stream-play-plus.apk
          git commit -m "App Rager v1.2.8 (versionCode 11): entrada por panel.ragerservices.net y aviso de actualización al abrir"
          git push
